[project]
name = "share"
version = "0.1.0"
description = "Self-hosted artifact sharing for AI agents — post files, stable URLs, expiring share links"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.5",
    "python-multipart>=0.0.12",
    "redis>=5.2.0",
    "webauthn>=2.2.0",
    "argon2-cffi>=23.1.0",
    "mistune>=3.1.0",
    "nh3>=0.2.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
sharectl = "sharectl.cli:main"
share = "share_cli.main:main"

[tool.setuptools.packages.find]
include = ["server*", "sharectl*", "share_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["server", "share_cli", "sharectl"]
